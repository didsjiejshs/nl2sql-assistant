<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>产线数据问答助手 | NL2SQL Demo</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #171d26;
    --panel-2: #1e2632;
    --border: #2a3441;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3b82f6;
    --accent-2: #10b981;
    --warn: #f59e0b;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 60px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { margin-bottom: 22px; }
  h1 { font-size: 24px; margin: 0 0 6px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 12px; margin-left: 8px; vertical-align: middle;
  }
  .badge.mock { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid rgba(245,158,11,.35); }
  .badge.live { background: rgba(16,185,129,.15); color: var(--accent-2); border: 1px solid rgba(16,185,129,.35); }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
  }
  .input-row { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font-size: 15px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 12px 22px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 500;
    transition: opacity .15s;
  }
  button:hover { opacity: .88; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .examples { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 5px 12px; border-radius: 16px; font-size: 13px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  h2 { font-size: 14px; color: var(--muted); font-weight: 500; margin: 0 0 10px; }
  pre {
    margin: 0; padding: 14px; border-radius: 8px; overflow-x: auto;
    background: #0b0f14; border: 1px solid var(--border);
    font-family: "Consolas", "Monaco", monospace; font-size: 13px;
    color: #7ee787; white-space: pre-wrap; word-break: break-all;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; background: var(--panel-2); }
  tr:hover td { background: rgba(59,130,246,.06); }
  #chart { width: 100%; height: 360px; }
  #single { font-size: 44px; font-weight: 600; color: var(--accent-2); padding: 20px 0; }
  .explain {
    padding: 14px 16px; border-radius: 8px; font-size: 14px;
    background: rgba(16,185,129,.08); border-left: 3px solid var(--accent-2);
  }
  .warn {
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 10px;
    background: rgba(245,158,11,.1); border-left: 3px solid var(--warn); color: #fbbf24;
  }
  .err {
    padding: 12px 16px; border-radius: 8px; font-size: 14px;
    background: rgba(239,68,68,.1); border-left: 3px solid var(--danger); color: #fca5a5;
    white-space: pre-wrap;
  }
  .hidden { display: none; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>产线数据问答助手 <span id="modeBadge" class="badge mock">加载中…</span></h1>
    <div class="sub">用中文提问 · 大模型生成 SQL · 安全校验后执行 · 自动选图与输出结论</div>
    <div class="meta" id="overview"></div>
  </header>

  <div class="panel">
    <div class="input-row">
      <input type="text" id="q" placeholder="例如：哪条产线的不良率最高？" autocomplete="off" />
      <button id="go">提问</button>
    </div>
    <div class="examples" id="examples"></div>
  </div>

  <div id="errorBox" class="panel hidden"><div class="err" id="errorText"></div></div>

  <div class="panel hidden" id="sqlPanel">
    <h2>生成的 SQL（已通过安全校验）</h2>
    <pre id="sql"></pre>
    <div id="warns"></div>
  </div>

  <div class="panel hidden" id="chartPanel">
    <h2>查询结果</h2>
    <div id="chart"></div>
    <div id="single" class="hidden"></div>
    <div id="tableWrap" class="hidden" style="overflow-x:auto; max-height:420px; overflow-y:auto;">
      <table id="table"></table>
    </div>
    <div class="meta" id="rowInfo"></div>
  </div>

  <div class="panel hidden" id="explainPanel">
    <h2>AI 结论</h2>
    <div class="explain" id="explain"></div>
  </div>

  <footer>NL2SQL Data Assistant · FastAPI + 大模型 + SQL Guard · MIT License</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let chart = null;

function setMode(mode) {
  const badge = $("modeBadge");
  const isMock = mode.indexOf("mock") === 0;
  badge.className = "badge " + (isMock ? "mock" : "live");
  badge.textContent = isMock
    ? "演示模式（规则引擎，无需 API Key）"
    : "在线模式（" + mode + "）";
}

async function loadHealth() {
  try {
    const res = await fetch("/api/health");
    const data = await res.json();
    if (data.mode) setMode(data.mode);
    if (data.data) {
      const d = data.data;
      $("overview").textContent =
        "数据表：production_records ｜ 共 " + d.total_records + " 条记录 ｜ 覆盖 " +
        d.date_start + " ~ " + d.date_end + " ｜ 产线：" + d.lines.join("、");
    }
  } catch (e) {
    $("overview").textContent = "服务未就绪，请确认已执行 python -m data.seed";
  }
}

async function loadExamples() {
  try {
    const res = await fetch("/api/examples");
    const data = await res.json();
    $("examples").innerHTML = "";
    data.examples.forEach((q) => {
      const el = document.createElement("span");
      el.className = "chip";
      el.textContent = q;
      el.onclick = () => { $("q").value = q; ask(); };
      $("examples").appendChild(el);
    });
  } catch (e) {}
}

function showError(msg) {
  $("errorBox").classList.remove("hidden");
  $("errorText").textContent = msg;
}

function hideAll() {
  ["errorBox", "sqlPanel", "chartPanel", "explainPanel"].forEach((id) => {
    $(id).classList.add("hidden");
  });
}

function renderTable(columns, rows) {
  let html = "<thead><tr>";
  columns.forEach((c) => { html += "<th>" + c + "</th>"; });
  html += "</tr></thead><tbody>";
  rows.forEach((r) => {
    html += "<tr>";
    r.forEach((v) => { html += "<td>" + (v === null ? "—" : v) + "</td>"; });
    html += "</tr>";
  });
  html += "</tbody>";
  $("table").innerHTML = html;
}

function renderChart(columns, rows, chartType) {
  const chartEl = $("chart");
  const singleEl = $("single");
  const tableWrap = $("tableWrap");

  if (chart) { chart.dispose(); chart = null; }
  chartEl.classList.add("hidden");
  singleEl.classList.add("hidden");
  tableWrap.classList.add("hidden");

  if (chartType === "none") {
    chartEl.classList.remove("hidden");
    chartEl.innerHTML = '<div style="padding:40px;text-align:center;color:#8b949e">没有查询到数据</div>';
    return;
  }

  if (chartType === "single") {
    singleEl.classList.remove("hidden");
    singleEl.textContent = rows[0][0];
    return;
  }

  if (chartType === "table") {
    tableWrap.classList.remove("hidden");
    renderTable(columns, rows);
    return;
  }

  // line / bar：复用表格渲染，同时叠加图表
  tableWrap.classList.remove("hidden");
  renderTable(columns, rows);

  chartEl.classList.remove("hidden");
  chart = echarts.init(chartEl, "dark");

  const xData = rows.map((r) => r[0]);
  const series = [];
  for (let i = 1; i < columns.length; i++) {
    series.push({
      name: columns[i],
      type: chartType === "line" ? "line" : "bar",
      smooth: chartType === "line",
      data: rows.map((r) => r[i]),
      itemStyle: { color: i === 1 ? "#3b82f6" : "#10b981" },
    });
  }

  chart.setOption({
    backgroundColor: "transparent",
    tooltip: { trigger: "axis" },
    legend: { textStyle: { color: "#8b949e" }, top: 0 },
    grid: { left: 60, right: 30, top: 40, bottom: 60 },
    xAxis: {
      type: "category",
      data: xData,
      axisLabel: { color: "#8b949e", rotate: xData.length > 12 ? 45 : 0 },
      axisLine: { lineStyle: { color: "#2a3441" } },
    },
    yAxis: {
      type: "value",
      axisLabel: { color: "#8b949e" },
      splitLine: { lineStyle: { color: "#212a35" } },
    },
    series: series,
  });
}

async function ask() {
  const question = $("q").value.trim();
  if (!question) { showError("请输入问题。"); return; }

  hideAll();
  $("go").disabled = true;
  $("go").textContent = "查询中…";

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question }),
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.detail || "请求失败");
      return;
    }

    setMode(data.mode);

    $("sqlPanel").classList.remove("hidden");
    $("sql").textContent = data.sql;

    if (data.warnings && data.warnings.length) {
      $("warns").innerHTML = data.warnings
        .map((w) => '<div class="warn">' + w + "</div>")
        .join("");
    } else {
      $("warns").innerHTML = "";
    }

    $("chartPanel").classList.remove("hidden");
    renderChart(data.columns, data.rows, data.chart_type);
    $("rowInfo").textContent = "返回 " + data.row_count + " 行" +
      (data.truncated ? "（已截断）" : "");

    if (data.explanation) {
      $("explainPanel").classList.remove("hidden");
      $("explain").textContent = data.explanation;
    }
  } catch (e) {
    showError("网络错误：" + e.message);
  } finally {
    $("go").disabled = false;
    $("go").textContent = "提问";
  }
}

$("go").onclick = ask;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
window.addEventListener("resize", () => { if (chart) chart.resize(); });

loadHealth();
loadExamples();
</script>
</body>
</html>
